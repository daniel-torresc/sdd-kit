# The project's technology stack — the place that says which technologies this project uses,
# the commands that run it, and the tools its work relies on.
#
# Where its entries come from:
#   - The human, at any time: entries with `fixed: true` are constraints. They never change without
#     the human, and every technology decision treats them as non-negotiable.
#   - Onboarding: the technologies already in use, and the targets the human confirms.
#   - Design: the choices the human made in a decision, and smaller, reversible choices.
#
# How it is used:
#   - Every phase reads it to know which technologies the work involves (a task's `stack:` field names the concerns).
#   - Entries with `status: proposed` are pending decisions (see `decision`).

version: 1

technologies:
  - concern: <concern>                 # what this entry covers: a language, framework, datastore, testing tool, …
    choice: <technology>               # null while undecided
    version: "<version or range>"
    status: decided                    # proposed | decided | superseded
    decided-by: human                  # human | design (a reversible choice made in Design) | existing (already in the code)
    fixed: true                        # true = human constraint; never changed without the human
    rationale: "<why>"
    adr: null                          # ADR-NNNN when the decision has one
    decision: null                     # decisions.md entry while proposed
    research: null                     # research note(s) about this technology (options analysis, technology reference)

  - concern: <concern>
    choice: null
    status: proposed
    decided-by: null
    fixed: false
    decision: specs/001-<slug>/decisions.md#H-01

# Project commands, by purpose, so the project is always installed, tested, checked, built and run the same way.
# Add any purpose the project needs. Never list production deploys or infrastructure applies.
commands:
  install:            # install dependencies
    - "<command>"
  test:               # the full suite
    - "<command>"
  check:              # every other check the project runs (lint, types, …)
    - "<command>"
  build:
    - "<command>"
  run:
    - "<command>"

# The tools the project's work relies on outside the code: issue tracker, documentation space, chat,
# design tool, CI provider, monitoring, and the like. Every phase reads them as context.
# How a tool must be used (for example, one issue per feature) is a practice: it belongs in the
# constitution, and `practice` points to it.
tools:
  - purpose: <purpose>                 # issue-tracker, docs, chat, design, ci, monitoring, …
    tool: <tool>                       # null while undecided
    access: mcp                        # mcp (a connector the session has) | cli | manual (the human uses it)
    where: "<workspace, team, project or URL>"
    use: "<what the project uses it for>"
    status: decided                    # proposed | decided | superseded
    practice: null                     # EP-NNN in the constitution, when one governs its use
