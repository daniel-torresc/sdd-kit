# Feature state — written by the hub after every step, readable by anyone. Do not edit by hand.
feature: F000 <title>
class: M                      # S | M | L (class T has no spec folder; the foundation is L)
status: "<phase> — <one-line summary of where things stand>"
waiting-for-human: nothing    # or: "<decision> (decisions.md#<id>)"
next: "<the next step the hub will take>"

phases:                       # not started | in progress | done | skipped
  discover: skipped           # L only
  specify: not started
  design: not started
  plan: not started
  build: not started
  verify: not started
  release: not started
  evolve: not started         # on sdd/F<NNN>-followup after the merge; done when you merge that PR

lenses: []                    # active review lenses, e.g. [security, ux, privacy]

review-rounds: {}             # e.g. { specify: 1, design: 2 } — counts against the loop caps

tasks: {}                     # e.g. { "T-01 Acceptance tests for reset": integrated, "T-02 Reset flow": "in review (round 1)" }

stale: []                     # artifacts that must be re-validated because an upstream artifact changed

history: []                   # one line per step, newest last: "YYYY-MM-DD <what happened>"
