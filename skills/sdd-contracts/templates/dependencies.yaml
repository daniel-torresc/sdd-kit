# Approved runtime dependencies. The SDD guard blocks engineers from adding any runtime
# dependency not listed here (dev-only tools are not listed; they are D1 and logged).
# Owner: security-engineer (dependency-review). The architect lists the runtime dependencies a
# design needs in design.md; security-engineer vets and records them here.
version: 1
runtime:
  - name: <package>
    ecosystem: <package registry>
    version: "<allowed range>"
    license: <SPDX id>
    purpose: <why it is needed (ADR or design reference)>
    status: approved           # approved | rejected
    approved-by: security-engineer
    checked: 2026-10-01        # license, known vulnerabilities, maintenance health
