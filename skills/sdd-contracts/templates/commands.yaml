# Project command registry — the commands agents may run in this project, by purpose.
# Owned by platform-engineer (written during scaffolding / adoption, updated when tooling changes);
# the architect reviews changes (D2).
#
# The SDD guard reads the COMMITTED version of this file in the main checkout (the feature branch — changes on a
# task branch take effect only after the architect's review and integration), and allows an agent
# to run a command only if it starts with one of the prefixes listed under a purpose that agent is
# entitled to (hooks/ownership.json, "project_commands"). Chaining, redirection, shell variables and
# globally dangerous commands are always denied.
#
# Format (keep it simple — the guard parses it without a YAML library):
#   commands:
#     <purpose>:
#       - "<command prefix>"
# One quoted prefix per line. A prefix matches the whole command or the command followed by a space;
# a prefix ending in "/" also matches any path below it (no "..").

version: 1

commands:
  install:            # install/sync dependencies from the lockfile
    - "<e.g. package manager sync command>"
  deps-add:           # add a RUNTIME dependency (checked against .sdd/dependencies.yaml)
    - "<e.g. package manager add command>"
  deps-add-dev:       # add a development-only dependency (no approval needed; logged)
    - "<e.g. package manager add --dev command>"
  deps-remove:
    - "<…>"
  format:
    - "<formatter command>"
  lint:
    - "<linter command>"
  typecheck:
    - "<type checker command>"
  test:               # unit/integration/acceptance tests, with machine-readable (JUnit) output option
    - "<test runner command>"
  coverage:           # diff coverage against a branch
    - "<diff coverage command>"
  contract-test:
    - "<contract test command>"
  e2e:
    - "<end-to-end test command>"
  mutation:
    - "<mutation testing command>"
  perf:               # load / performance tests (local or staging only)
    - "<load test command>"
  profile:            # profilers for diagnosis
    - "<profiler command>"
  spike:              # run throwaway experiments inside .sdd/spikes/<SPK-nn-slug>/ (architect)
    - "<command that runs code in a directory>.sdd/spikes/"   # ends with "/" so it matches .sdd/spikes/<SPK-nn-slug>
  migrate:            # schema migrations up/down
    - "<migration command>"
  run:                # run the app locally
    - "<run command>"
  build:              # build artifacts (images, bundles)
    - "<build command>"
  scan:               # supply-chain and security scanners (dependency audit, secrets, SBOM, artifact scan, SAST)
    - "<scanner command>"
  pipeline-lint:      # lint pipeline / container / infrastructure definitions
    - "<linter command>"
  infra-plan:         # infrastructure previews only (never apply)
    - "<plan command>"
  deploy-nonprod:     # trigger dev/staging deployments (production is never listed here)
    - "<deploy command for dev>"
    - "<deploy command for staging>"
  cloud-read:         # read-only cloud inspection
    - "<read-only cloud command>"
  dast:               # dynamic security scan against local/staging only
    - "<scanner command against localhost or staging>"
