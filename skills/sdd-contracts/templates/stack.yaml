# The project's technology stack — the single place that says which technologies this project uses
# and which technology-specific skills the agents should load for each.
#
# Who writes it:
#   - The human, at any time: entries with `fixed: true` are constraints. Agents must never change
#     or remove them; they appear in every technology decision as non-negotiable.
#   - The architect: entries decided at a G2 gate (`decided-by: human-at-G2`) or as smaller
#     reversible choices (`decided-by: architect`, logged as D1, ADR if significant).
#   - The researcher may propose candidate skills for an entry (in a research note); the human chooses.
#
# How it is used:
#   - The hub reads it at every dispatch and tells each agent which `skills` to load for the
#     technologies its task involves (the task's `stack:` field names the concerns).
#   - Skills listed here must be installed; if one is missing, the hub tells the human where it
#     comes from (`skill-sources`). Until then agents rely on official docs and any technology research note.
#   - Entries with `status: proposed` are pending decisions (see `decision`).
#   - `commands` lists the project's commands by purpose. The SDD guard lets each agent run only the
#     purposes in its policy, reading the version committed on the feature branch; a global denylist
#     always applies. The architect writes them; platform-engineer proposes changes through a finding.

version: 1

technologies:
  - concern: backend-language          # what this entry covers (language, framework, datastore, testing, ci, infra, cloud, frontend, …)
    choice: <technology>               # null while undecided
    version: "<version or range>"
    status: decided                    # proposed | decided | superseded
    decided-by: human                  # human | human-at-G2 | architect | existing (adopted codebase)
    fixed: true                        # true = human constraint; agents may not change it
    rationale: "<why>"
    adr: null                          # ADR-NNNN when decided through the architect
    decision: null                     # decisions.md entry (G2) while proposed
    research: null                     # research note(s) about this technology (options analysis, technology reference)
    skills: []                         # technology-specific skills to load for this technology

  - concern: <concern>
    choice: null
    status: proposed
    decided-by: null
    fixed: false
    decision: specs/000-foundation/decisions.md#G2-<slug>
    skills: []

# Where listed skills come from (so the human can install missing ones).
skill-sources:
  - skill: <skill-name>
    source: <marketplace/plugin or repository>

# Project commands, by purpose. Format (parsed without a YAML library): one quoted prefix per line.
# A prefix matches the whole command or the command followed by a space; a prefix ending in "/"
# also matches any path below it (no ".."). Never list production deploys or infrastructure applies.
commands:
  install:            # install/sync dependencies from the lockfile
    - "<command>"
  deps-add:           # add a runtime dependency (must be approved in the design / security review)
    - "<command>"
  deps-add-dev:
    - "<command>"
  deps-remove:
    - "<command>"
  format:
    - "<command>"
  lint:
    - "<command>"
  typecheck:
    - "<command>"
  test:               # with a machine-readable (JUnit) output option
    - "<command>"
  coverage:           # diff coverage against a branch
    - "<command>"
  contract-test:
    - "<command>"
  e2e:
    - "<command>"
  mutation:
    - "<command>"
  perf:               # load / performance tests (local or staging only)
    - "<command>"
  profile:
    - "<command>"
  migrate:
    - "<command>"
  run:
    - "<command>"
  build:
    - "<command>"
  scan:               # dependency audit, secret scanning, bill of materials, artifact scan, static security analysis
    - "<command>"
  pipeline-lint:
    - "<command>"
  infra-plan:         # infrastructure previews only
    - "<command>"
  deploy-nonprod:     # dev / staging only
    - "<command>"
  cloud-read:         # read-only cloud inspection
    - "<command>"
  dast:               # dynamic scan against local / staging only
    - "<command>"
