# The project's technology stack — the place that says which technologies this project uses.
#
# Who writes it:
#   - The human, at any time: entries with `fixed: true` are constraints. Agents must never change
#     or remove them; they appear in every technology decision as non-negotiable.
#   - The architect: entries the human chose in a decision or smaller, reversible choices of its own.
#
# How it is used:
#   - Agents read it to know which technologies the work involves (a task's `stack:` field names the concerns).
#   - Entries with `status: proposed` are pending decisions (see `decision`).

version: 1

technologies:
  - concern: <concern>                 # what this entry covers: a language, framework, datastore, testing tool, …
    choice: <technology>               # null while undecided
    version: "<version or range>"
    status: decided                    # proposed | decided | superseded
    decided-by: human                  # human | agent | existing (already in the code)
    fixed: true                        # true = human constraint; agents may not change it
    rationale: "<why>"
    adr: null                          # ADR-NNNN when decided through the agent
    decision: null                     # decisions.md entry while proposed
    research: null                     # research note(s) about this technology (options analysis, technology reference)

  - concern: <concern>
    choice: null
    status: proposed
    decided-by: null
    fixed: false
    decision: specs/001-<slug>/decisions.md#H-01

# Project commands, by purpose, so every agent builds, checks and runs the project the same way.
# Add any purpose the project needs. Never list production deploys or infrastructure applies.
commands:
  install:            # install dependencies
    - "<command>"
  test:               # the full suite
    - "<command>"
  check:              # every other check the project runs (lint, types, …)
    - "<command>"
  build:
    - "<command>"
  run:
    - "<command>"
